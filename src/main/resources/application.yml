clients:
  pagbank:
    base-url: https://api.pagseguro.com
    token: ${PAGBANK_TOKEN}

server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  http2:
    enabled: true
  port: 443
  ssl:
    key-store: classpath:ssl/keystore.p12
    key-store-password: ${KEY_STORE_PASSWORD}
    key-store-type: PKCS12

spring:
  security.oauth2.client:
    registration:
      google:
        client-id: ${GOOGLE_CLIENT_ID}
        client-secret: ${GOOGLE_CLIENT_SECRET}
        scope: profile,email
      facebook:
        client-id: ${FACEBOOK_CLIENT_ID}
        client-secret: ${FACEBOOK_CLIENT_SECRET}
        scope: public_profile,email
    provider:
      facebook:
        # Overriding the default endpoint to explicitly declare requested fields
        user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture.type(large)
  cloud:
    aws:
      region:
        static: sa-east-1
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      endpoint: https://s3.sa-east-1.amazonaws.com/
      ses:
        endpoint: https://email.sa-east-1.amazonaws.com
  application:
    name: zouk-albums
  flyway:
    enabled: true
    baseline-on-migrate: true

  datasource:
    url: jdbc:postgresql://localhost:5432/zouk-albums
    username: zoukme.in
    password: s3cr3t
    connection-fetch: lazy # lazy connection feature for spring boot 4.1
  docker:
    compose:
      lifecycle-management: none
  sql:
    init:
      mode: never

  threads:
    virtual:
      enabled: true
